name: CI

on:
  pull_request:
    branches: [master, pre-release, "release/**"]
  push:
    branches: [master, pre-release, "release/**"]

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tesla
          POSTGRES_PASSWORD: tesla
          POSTGRES_DB: dhaka_tesla_pool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tesla -d dhaka_tesla_pool"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tesla:tesla@localhost:5432/dhaka_tesla_pool
      DIRECT_URL: postgresql://tesla:tesla@localhost:5432/dhaka_tesla_pool
      JWT_SECRET: ci-only-secret

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # postinstall runs `prisma generate`
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check formatting
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Check API docs metadata is up to date
        run: |
          npm run docs:metadata
          git diff --exit-code -- src/metadata.ts || {
            echo "::error::src/metadata.ts is stale. Run 'npm run docs:metadata' in backend/ and commit it."
            exit 1
          }

      - name: Unit tests
        run: npm test

      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed database
        run: npm run db:seed

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Generates Next.js route types (e.g. LayoutProps) before checking.
      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docker:
    name: Docker stack and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      # The whole stack as a reviewer would run it: database, migrations and
      # seed, API, and UI. --wait returns once the health checks pass.
      - name: Start the stack
        run: docker compose up -d --wait

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install browser test dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: e2e
        run: npx playwright test

      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Show container logs
        if: failure()
        run: docker compose logs --tail=200
