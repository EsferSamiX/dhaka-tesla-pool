name: dhaka-tesla-pool

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tesla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tesla}
      POSTGRES_DB: ${POSTGRES_DB:-dhaka_tesla_pool}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off job: applies migrations and seeds the story cast, then exits.
  # Uses the backend's build stage, which still has the Prisma CLI.
  migrate:
    build:
      context: ./backend
      target: build
    command: sh -c "npx prisma migrate deploy && node dist/database/seed.js"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tesla}:${POSTGRES_PASSWORD:-tesla}@postgres:5432/${POSTGRES_DB:-dhaka_tesla_pool}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tesla}:${POSTGRES_PASSWORD:-tesla}@postgres:5432/${POSTGRES_DB:-dhaka_tesla_pool}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:4000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
